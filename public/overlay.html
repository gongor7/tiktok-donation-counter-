<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Donation Overlay - OBS</title>
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@c00;800;900&display=swap">
</head>
<body>
    <div id="overlay-container" class="overlay-container">
        <!-- Goal Cute Pink Box with Aleli & Bunny -->
        <div class="goal-box">
            <img src="aleli.jpg" class="aleli-flower-left" alt="Aleli">
            <img src="bunny.jpg" class="bunny-character-right" alt="Conejita">
            <div class="goal-header">
                <span class="goal-title">META DE DONACIONES</span>
                <span class="goal-values">
                    <span id="coins-val">0</span> / <span id="goal-val">1000</span> 🏵
                </span>
            </div>
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
                <span id="progress-percent" class="progress-text">0%</span>
            </div>
        </div>


        <!-- Cute Notification Pop-up for incoming gifts -->
        <div id="gift-popup" class="goal-box gift-popup hidden">
            <img src="bunny.jpg" class="aleli-icon-popup" alt="Conejita">
            <div class="gift-popup-content">
                <div class="donor-name" id="popup-donor">Usuario</div>
                <div class="gift-details">
                   envió <span id="popup-count">1</span>x <span id="popup-gift">Rosa</span> (+<span id="popup-coins">10</span> 🏵)
                </div>
            </div>
        </div>
    </div>


    <script src="/socket.io/socket.io.js"></script>
    <script src="js/overlay.js"></script>
</body>
</html>
