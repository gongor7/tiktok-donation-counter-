<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Donation Overlay - OBS</title>
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Potter+One&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap">
</head>
<body>
    <div id="overlay-container" class="overlay-container">
        <!-- Floating Particle / Petal Container -->
        <div id="particles-container" class="particles-container"></div>

        <!-- Goal Cute Pink Box with Aleli Flowers -->
        <div class="goal-box">
            <img src="aleli.jpg" class="aleli-flower-left" alt="Aleli">
            <img src="aleli.jpg" class="aleli-flower-right" alt="Aleli">
            <div class="goal-header">
                <span class="header-title">🌸 META DE DONACIONES 🌸</span>
                <span class="goal-values">
                    <span id="coins-val" class="coins-number">0</span> / <span id="goal-val">1000</span> 🪙
                </span>
            </div>
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
                <span id="progress-percent" class="progress-text">0%</span>
            </div>
        </div>

        <!-- GIGANTIC SUPER ALERT MODAL FOR DONATIONS -->
        <div id="big-gift-alert" class="big-gift-alert hidden">
            <div class="alert-card">
                <div class="alert-sparkles">✨🌸💖🌸✨</div>
                
                <div class="alert-body">
                    <div class="alert-avatar-box">
                        <img id="alert-img" src="aleli.jpg" class="alert-flower-img" alt="Aleli">
                    </div>
                    
                    <div class="alert-info">
                        <div class="alert-tag">¡NUEVA DONACIÓN EN VIVO! 💖</div>
                        <!-- NOMBRE GIGANTE DEL DONADOR -->
                        <div id="alert-donor" class="alert-giant-donor">Leandro Góngora</div>
                        <div class="alert-gift-row">
                            envió <span id="alert-count" class="alert-count">1</span>x <span id="alert-gift" class="alert-gift-name">Rosa</span>
                        </div>
                        <div class="alert-coins-badge">
                            +<span id="alert-coins">1</span> MONEDAS 🪙
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CUTE KEYWORD POP-UP FOR COMMENTS (ALELI & PRUEBA) -->
        <div id="keyword-alert" class="keyword-alert hidden">
            <div class="keyword-card">
                <img src="aleli.jpg" class="keyword-flower" alt="Aleli">
                <div class="keyword-content">
                    <div id="keyword-tag" class="keyword-tag">🌸 ¡HOLA! 🌸</div>
                    <div id="keyword-title" class="keyword-title">¡Hola Leandro! 🌸🐰💖</div>
                    <div id="keyword-msg" class="keyword-reply-msg">
                        ¡Gracias por saludar a Alelí! ✨
                    </div>
                </div>
            </div>
        </div>

        <!-- Audio Unlock Hint for Browsers -->
        <div id="audio-unlock-hint" class="audio-unlock-hint">
            🔊 Haz clic en cualquier parte de esta pantalla para activar el audio y la voz
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/overlay.js"></script>
</body>
</html>
